name: Java Application Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven Clean Package
        run: mvn clean package    

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: haripriya1310
          password: dckr_pat_VWMdcYNG9DdZJUr-k2vqb1XW4nE

      - name: Docker Build
        run: docker build -t haripriya1310/springboot-maven-poc:v1 .   

      - name: Docker Push
        run: docker push haripriya1310/springboot-maven-poc:v1
